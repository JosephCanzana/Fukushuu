{% load static %}
{# Public-facing top navigation bar. Included by base_public.html. #}
{# TODO: swap the remaining '#' hrefs for {% url %} tags once accounts routes are named. #}
<nav class="border-b sticky top-0 z-100 border-border bg-surface"
     x-data="{ mobileOpen: false }">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
        <div class="flex items-center gap-2">

            <!-- Hamburger toggle — mobile only, opens the panel below. -->
            <button type="button"
                    @click="mobileOpen = !mobileOpen"
                    :aria-expanded="mobileOpen"
                    aria-label="Toggle navigation menu"
                    aria-haspopup="true"
                    class="md:hidden ml-1 w-9 h-9 flex items-center justify-center rounded-md text-txt-secondary border border-border hover:bg-surface-alt">
                <svg x-show="!mobileOpen" aria-hidden="true" class="size-5">
                    <use href="{% static 'icons/sprite.svg' %}#bars-3"></use>
                </svg>
                <svg x-show="mobileOpen" x-cloak aria-hidden="true" class="size-5">
                    <use href="{% static 'icons/sprite.svg' %}#x-mark"></use>
                </svg>
            </button>
            <a href="{% url 'pages:landing' %}" class="hover:opacity-80 text-txt-primary shrink-0">
                {% include "includes/logo.html" %}
            </a>
        </div>

        <!-- Primary links — visible md+, collapse into the hamburger panel below md. -->
        <div class="hidden md:flex items-center gap-1 text-base font-medium">
            <a href="{% url 'pages:landing' %}"
               class="px-3 py-1.5 rounded-md text-txt-secondary hover:bg-surface-alt hover:text-txt-primary">
                Home
            </a>
            <a href="{% url 'pages:landing' %}#about"
               class="px-3 py-1.5 rounded-md text-txt-secondary hover:bg-surface-alt hover:text-txt-primary">
                About
            </a>
            <a href="{% url 'pages:landing' %}#why"
               class="px-3 py-1.5 rounded-md text-txt-secondary hover:bg-surface-alt hover:text-txt-primary">
                Why it works
            </a>
        </div>

        <div class="flex items-center gap-2">
            <a href="#"
               class=" px-3 py-1.5 text-base font-medium rounded-md text-txt-secondary hover:bg-surface-alt">
                Log in
            </a>
            <a href="{% url 'accounts:landing' %}"
               class="px-3 py-1.5 text-base font-medium rounded-md bg-accent text-white hover:bg-accent-hover">
                Sign up
            </a>

            <!-- Light/dark toggle -->
            <button type="button"
                    x-data="{ dark: document.documentElement.classList.contains('dark') }"
                    @click="dark = !dark; document.documentElement.classList.toggle('dark', dark); localStorage.setItem('color-scheme', dark ? 'dark' : 'light')"
                    :aria-label="dark ? 'Switch to light mode' : 'Switch to dark mode'"
                    class="hidden md:flex ml-1 w-9 h-9 items-center justify-center rounded-md text-txt-secondary border border-border hover:bg-surface-alt">
                <svg x-show="!dark" aria-hidden="true" class="size-5">
                    <use href="{% static 'icons/sprite.svg' %}#moon"></use>
                </svg>
                <svg x-show="dark" x-cloak aria-hidden="true" class="size-5">
                    <use href="{% static 'icons/sprite.svg' %}#sun"></use>
                </svg>
            </button>

        </div>
    </div>

    <!-- Mobile nav panel — mirrors the md+ links above plus the items hidden
       at that breakpoint (Log in). Closes itself on link tap. -->
    <div x-show="mobileOpen"
         x-cloak
         x-transition
         class="md:hidden border-t border-border bg-surface">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col gap-1 text-base font-medium">
            <a href="{% url 'pages:landing' %}"
               @click="mobileOpen = false"
               class="px-3 py-2 rounded-md text-txt-secondary hover:bg-surface-alt hover:text-txt-primary">
                Home
            </a>
            <a href="{% url 'pages:landing' %}#about"
               @click="mobileOpen = false"
               class="px-3 py-2 rounded-md text-txt-secondary hover:bg-surface-alt hover:text-txt-primary">
                About
            </a>
            <a href="{% url 'pages:landing' %}#why"
               @click="mobileOpen = false"
               class="px-3 py-2 rounded-md text-txt-secondary hover:bg-surface-alt hover:text-txt-primary">
                Why it works
            </a>
            <button type="button"
                    x-data="{ dark: document.documentElement.classList.contains('dark') }"
                    @click="dark = !dark; document.documentElement.classList.toggle('dark', dark); localStorage.setItem('color-scheme', dark ? 'dark' : 'light')"
                    :aria-label="dark ? 'Switch to light mode' : 'Switch to dark mode'"
                    class="flex items-center gap-3 px-3 py-2 rounded-md text-txt-secondary hover:bg-surface-alt hover:text-txt-primary text-left">
              
                <span x-text="dark ? 'Light mode' : 'Dark mode'"></span>
            </button>
        </div>
    </div>
</nav>
